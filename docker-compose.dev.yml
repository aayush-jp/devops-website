version: '3.8'

services:
  portfolio-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: development
    image: aayush-portfolio:dev
    container_name: aayush-portfolio-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    command: npm run dev
    networks:
      - portfolio-dev-network
    labels:
      - "com.example.description=Aayush JP Portfolio - Development"
      - "com.example.environment=development"

networks:
  portfolio-dev-network:
    driver: bridge
    name: portfolio-dev-network
